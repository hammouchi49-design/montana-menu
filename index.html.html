<!doctype html>
<html lang="de">
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
<canvas id="screen"></canvas>
<script>
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d', {alpha: true});
const images = new Map();
let menuFont = '"Chalet Embedded"';
let fontReady = false;
let clipDepth = 0;
let fontAtlas = null;
const atlasTextCache = new Map();

function rasterizeAtlasText(value, size, fontSize, color) {
  const font = fontAtlas.metrics.fonts[String(fontSize)] || fontAtlas.metrics.fonts[String(size)] || fontAtlas.metrics.fonts['11'];
  const key = `${font.size}\0${size}\0${value}`;
  const cached = atlasTextCache.get(key);
  if (cached) return cached;
  const scale = size / font.size;
  let penX = 0, penY = 0, width = 0;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  const glyphs = [];
  for (const character of value) {
    if (character === '\n') { width = Math.max(width, penX); penX = 0; penY += size; continue; }
    const codepoint = character.codePointAt(0);
    const glyph = font.glyphs[String(codepoint)] || font.glyphs['63'];
    if (character === '\t') { penX += font.glyphs['32'][8] * scale * 4; continue; }
    if (glyph[2] > 0 && glyph[3] > 0) {
      const left = penX + glyph[4] * scale, top = penY + glyph[5] * scale;
      const w = glyph[6] * scale, h = glyph[7] * scale;
      minX = Math.min(minX, left); minY = Math.min(minY, top);
      maxX = Math.max(maxX, left + w); maxY = Math.max(maxY, top + h);
      glyphs.push({glyph, left, top, w, h});
    }
    penX += glyph[8] * scale;
  }
  width = Math.max(width, penX);
  let bitmap = null, originX = 0, originY = 0;
  if (glyphs.length) {
    originX = Math.floor(minX) - 1; originY = Math.floor(minY) - 1;
    bitmap = document.createElement('canvas');
    bitmap.width = Math.ceil(maxX) - originX + 1;
    bitmap.height = Math.ceil(maxY) - originY + 1;
    const ink = bitmap.getContext('2d', {alpha: true});
    ink.imageSmoothingEnabled = true;
    ink.imageSmoothingQuality = 'low';
    for (const item of glyphs) {
      const g = item.glyph;
      ink.drawImage(fontAtlas.image, g[0], g[1], g[2], g[3],
        item.left - originX, item.top - originY, item.w, item.h);
    }
  }
  const result = {bitmap, originX, originY, width, colors: new Map(), dynamic: null, lastColor: null};
  if (!bitmap || (bitmap.width <= 1024 && bitmap.height <= 256)) {
    if (atlasTextCache.size >= 512) atlasTextCache.delete(atlasTextCache.keys().next().value);
    atlasTextCache.set(key, result);
  }
  return result;
}

function coloredAtlasText(text, color) {
  const stable = color === '#000000' || color === '#f2f2f4';
  if (stable && text.colors.has(color)) return text.colors.get(color);
  if (!stable && text.dynamic && text.lastColor === color) return text.dynamic;
  let bitmap = stable ? null : text.dynamic;
  if (!bitmap) {
    bitmap = document.createElement('canvas');
    bitmap.width = text.bitmap.width; bitmap.height = text.bitmap.height;
  }
  const ink = bitmap.getContext('2d', {alpha: true});
  ink.globalCompositeOperation = 'source-over';
  ink.clearRect(0, 0, bitmap.width, bitmap.height);
  ink.drawImage(text.bitmap, 0, 0);
  ink.globalCompositeOperation = 'source-in';
  ink.fillStyle = color;
  ink.fillRect(0, 0, bitmap.width, bitmap.height);
  if (stable) text.colors.set(color, bitmap);
  else { text.dynamic = bitmap; text.lastColor = color; }
  return bitmap;
}

function drawMenuText(value, x, y, size, centered, fontSize) {
  value = String(value);
  if (fontAtlas) {
    const text = rasterizeAtlasText(value, size, fontSize, ctx.fillStyle);
    if (text.bitmap) {
      // ImGui truncates the text origin. Cached pixels are copied at native size.
      const left = Math.trunc(x - (centered ? text.width / 2 : 0));
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(coloredAtlasText(text, ctx.fillStyle), left + text.originX, Math.trunc(y) + text.originY);
    }
    return;
  }
  ctx.font = `${Math.max(1, size)}px ${menuFont}`;
  ctx.textAlign = centered ? 'center' : 'left';
  ctx.fillText(value, x, y);
}

function drawStyledText(x, y, value, size, alpha, centered, outline, thickness, fontSize) {
  ctx.save();
  ctx.textBaseline = 'top';
  const opacity = Math.max(0, Math.min(1, alpha / 255));
  const contourWidth = Math.max(0, Math.min(3, outline));
  const passes = Math.ceil(contourWidth);
  if (passes > 0) {
    ctx.fillStyle = '#000000';
    ctx.globalAlpha = opacity * Math.floor(150 * Math.min(contourWidth, 1) / Math.sqrt(passes) + 0.5) / 255;
    for (let pass = 1; pass <= passes; pass++) {
      const radius = Math.min(pass, contourWidth);
      drawMenuText(value, x - radius, y, size, centered, fontSize);
      drawMenuText(value, x + radius, y, size, centered, fontSize);
      drawMenuText(value, x, y - radius, size, centered, fontSize);
      drawMenuText(value, x, y + radius, size, centered, fontSize);
    }
  }
  ctx.fillStyle = '#f2f2f4';
  ctx.globalAlpha = opacity;
  drawMenuText(value, x, y, size, centered, fontSize);
  for (let offset = 1; offset <= 2; offset++) {
    const strength = Math.max(0, Math.min(1, (thickness - (2 * offset - 1)) / 2));
    if (strength <= 0) continue;
    ctx.globalAlpha = Math.floor(alpha * strength + 0.5) / 255;
    drawMenuText(value, x - offset, y, size, centered, fontSize);
    drawMenuText(value, x + offset, y, size, centered, fontSize);
  }
  ctx.restore();
}

function fit(width, height) {
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
  }
}

function rgba(r, g, b, a, normalized) {
  if (normalized) {
    r *= 255; g *= 255; b *= 255; a *= 255;
  }
  return `rgba(${Math.max(0, Math.min(255, Math.round(r)))},${Math.max(0, Math.min(255, Math.round(g)))},${Math.max(0, Math.min(255, Math.round(b)))},${Math.max(0, Math.min(1, a / 255))})`;
}

function rounded(x, y, w, h, radius) {
  const r = Math.max(0, Math.min(radius || 0, Math.abs(w) / 2, Math.abs(h) / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function paintGradient(c) {
  const [_, x, y, w, h, tlr, tlg, tlb, tla, trr, trg, trb, tra,
    brr, brg, brb, bra, blr, blg, blb, bla, radius] = c;
  if (radius > 0) {
    ctx.save();
    rounded(x, y, w, h, radius);
    ctx.clip();
  }
  const same = (a, b) => Math.abs(a - b) < 0.0001;
  const horizontal = same(tlr, blr) && same(tlg, blg) && same(tlb, blb) && same(tla, bla)
    && same(trr, brr) && same(trg, brg) && same(trb, brb) && same(tra, bra);
  const vertical = same(tlr, trr) && same(tlg, trg) && same(tlb, trb) && same(tla, tra)
    && same(blr, brr) && same(blg, brg) && same(blb, brb) && same(bla, bra);
  if (horizontal || vertical) {
    const gradient = horizontal
      ? ctx.createLinearGradient(x, y, x + w, y)
      : ctx.createLinearGradient(x, y, x, y + h);
    gradient.addColorStop(0, rgba(tlr, tlg, tlb, tla, true));
    gradient.addColorStop(1, horizontal
      ? rgba(trr, trg, trb, tra, true)
      : rgba(blr, blg, blb, bla, true));
    ctx.fillStyle = gradient;
    ctx.fillRect(x, y, w, h);
  } else {
    const steps = Math.max(1, Math.min(12, Math.ceil(h / 4)));
    for (let i = 0; i < steps; i++) {
      const t = (i + 0.5) / steps;
      const mix = (a, b) => a + (b - a) * t;
      const gradient = ctx.createLinearGradient(x, y, x + w, y);
      gradient.addColorStop(0, rgba(mix(tlr, blr), mix(tlg, blg), mix(tlb, blb), mix(tla, bla), true));
      gradient.addColorStop(1, rgba(mix(trr, brr), mix(trg, brg), mix(trb, brb), mix(tra, bra), true));
      ctx.fillStyle = gradient;
      ctx.fillRect(x, y + h * i / steps, w, h / steps + 1);
    }
  }
  if (radius > 0) ctx.restore();
}

function paint(command) {
  const c = command;
  switch (c[0]) {
    case 'fill':
      ctx.fillStyle = rgba(c[5], c[6], c[7], c[8], false);
      rounded(c[1], c[2], c[3], c[4], c[9]);
      ctx.fill();
      break;
    case 'stroke':
      ctx.strokeStyle = rgba(c[5], c[6], c[7], c[8], false);
      ctx.lineWidth = c[9] || 1;
      rounded(c[1] + ctx.lineWidth / 2, c[2] + ctx.lineWidth / 2,
        c[3] - ctx.lineWidth, c[4] - ctx.lineWidth, c[10]);
      ctx.stroke();
      break;
    case 'line':
      ctx.strokeStyle = rgba(c[5], c[6], c[7], c[8], false);
      ctx.lineWidth = c[9] || 1;
      ctx.beginPath(); ctx.moveTo(c[1], c[2]); ctx.lineTo(c[3], c[4]); ctx.stroke();
      break;
    case 'circle': {
      const normalized = c[8] <= 1;
      const color = rgba(c[5], c[6], c[7], c[8], normalized);
      ctx.beginPath(); ctx.arc(c[1], c[2], Math.max(0, c[3]), 0, 2 * Math.PI);
      if (c[4]) { ctx.fillStyle = color; ctx.fill(); }
      else { ctx.strokeStyle = color; ctx.lineWidth = c[9] || 1; ctx.stroke(); }
      break;
    }
    case 'gradient':
      paintGradient(c);
      break;
    case 'text':
      ctx.save();
      ctx.textBaseline = 'top';
      ctx.fillStyle = rgba(c[5], c[6], c[7], 255, false);
      ctx.globalAlpha = Math.max(0, Math.min(1, c[8] / 255));
      drawMenuText(c[3], c[1], c[2], c[4], c[9], c[10]);
      ctx.restore();
      break;
    case 'styledText': {
      const [_, x, y, value, size, alpha, centered, outline, thickness, fontSize] = c;
      drawStyledText(x, y, value, size, alpha, centered, outline, thickness, fontSize);
      break;
    }
    case 'image': {
      const image = images.get(c[1]);
      if (!image || !image.complete || !image.naturalWidth) break;
      const [_, id, x, y, w, h, r, g, b, a, radius, u0, v0, u1, v1] = c;
      ctx.save();
      rounded(x, y, w, h, radius);
      ctx.clip();
      ctx.globalAlpha = Math.max(0, Math.min(1, a));
      ctx.drawImage(image, u0 * image.width, v0 * image.height,
        (u1 - u0) * image.width, (v1 - v0) * image.height, x, y, w, h);
      ctx.restore();
      break;
    }
    case 'clip':
      ctx.save(); clipDepth++; rounded(c[1], c[2], c[3], c[4], 0); ctx.clip();
      break;
    case 'unclip':
      if (clipDepth > 0) { ctx.restore(); clipDepth--; }
      break;
  }
}

let pendingFrame = null;
let frameScheduled = false;

function scheduleFrame() {
  if (!fontReady || frameScheduled) return;
  frameScheduled = true;
  requestAnimationFrame(() => {
    frameScheduled = false;
    if (pendingFrame) paintFrame(pendingFrame);
    pendingFrame = null;
  });
}

function loadFontFromLua(data) {
  if (typeof data !== 'string' || !/^[A-Za-z0-9+/=]+$/.test(data)) return;
  const embeddedFont = new FontFace('Chalet Embedded', `url(data:font/ttf;base64,${data})`);
  embeddedFont.load().then(loaded => {
    document.fonts.add(loaded);
    menuFont = '"Chalet Embedded"';
    fontReady = true;
    document.documentElement.dataset.menuFont = 'chalet';
    scheduleFrame();
  }).catch(error => {
    console.error('Embedded Chalet font could not be loaded', error);
    menuFont = '"Segoe UI"';
    fontReady = true;
    document.documentElement.dataset.menuFont = 'segoe-fallback';
    scheduleFrame();
  });
}

function paintFrame(data) {
  fit(data.width, data.height);
  while (clipDepth > 0) { ctx.restore(); clipDepth--; }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const command of data.commands) paint(command);
  while (clipDepth > 0) { ctx.restore(); clipDepth--; }
}

window.addEventListener('message', event => {
  let data = event.data;
  if (typeof data === 'string') {
    try { data = JSON.parse(data); } catch (_) { return; }
  }
  if (!data || !data.type) return;
  if (data.type === 'font-atlas') {
    if (!data.metrics || !data.metrics.fonts || typeof data.image !== 'string') return;
    const atlasImage = new Image();
    atlasImage.onload = () => {
      if (atlasImage.naturalWidth !== data.metrics.width || atlasImage.naturalHeight !== data.metrics.height) {
        loadFontFromLua(data.fontData);
        return;
      }
      fontAtlas = {image: atlasImage, metrics: data.metrics};
      atlasTextCache.clear();
      fontReady = true;
      document.documentElement.dataset.menuFont = 'chalet-atlas';
      scheduleFrame();
    };
    atlasImage.onerror = () => loadFontFromLua(data.fontData);
    atlasImage.src = `data:image/png;base64,${data.image}`;
    return;
  }
  if (data.type === 'font') {
    loadFontFromLua(data.data);
    return;
  }
  if (data.type === 'font-fallback') {
    menuFont = '"Segoe UI"';
    fontReady = true;
    document.documentElement.dataset.menuFont = 'segoe-fallback';
    scheduleFrame();
    return;
  }
  if (data.type === 'clipboard-copy') {
    fetch('/clipboard/copy', {method: 'POST', body: data.data});
    return;
  }
  if (data.type === 'clipboard-paste') {
    fetch('/clipboard/paste', {method: 'POST'});
    return;
  }
  if (data.type === 'image') {
    const image = new Image();
    image.src = `data:image/jpeg;base64,${data.data}`;
    images.set(data.id, image);
    return;
  }
  if (data.type === 'image-url') {
    if (typeof data.url !== 'string' || !/^https:\/\/imgdb\.io\/i\/[A-Za-z0-9]+\.jpg$/.test(data.url)) return;
    const image = new Image();
    image.src = data.url;
    images.set(data.id, image);
    return;
  }
  if (data.type === 'frame') {
    pendingFrame = data;
    scheduleFrame();
  }
});
</script>
</html>
